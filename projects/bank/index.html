<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="logocontainer">
      <img src="./sources/logo.png" alt="" />
    </div>
    <div class="maincard">
      <div id="leftcard" class="card"></div>
      <div id="rightcard" class="card">
        <h1>Welcome to<br />Adaveni Banking</h1>
        <div class="tagline"><p>🔑 secure and smart</p></div>
        <p>Don't have an account ?</p>
        <form action="SignupServ">
          <button type="submit" class="signup">Signup - Create Account</button>
        </form>
        <div class="divider">
          <hr />
          <span>or</span>
          <hr />
        </div>
        <p>Already have an account ?</p>
        <form action="LoginServ">
          <button type="submit" class="login">Log in to your account</button>
        </form>
      </div>
    </div>
  </body>
</html>
