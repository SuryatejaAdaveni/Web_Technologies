<!doctype html>
<html>
  <head>
    <title>Deposit</title>
    <link rel="stylesheet" href="./cards.css" />
  </head>
  <body>
    <div class="card">
      <h1>🏦 Deposit Money</h1>

      <form action="DepositServlet" method="post">
        <label>Enter Amount</label>
        <input
          type="number"
          name="amount"
          placeholder="₹ Enter Deposit Amount"
          required
        />

        <button>Deposit</button>
      </form>
    </div>
  </body>
</html>
