    <style>
      #parent {
        height: 500px;
        border: 2px solid rgb(0, 0, 0);
        margin: 100px;
        /* position: relative; */
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: nowrap;
      }
      .boxes {
        height: 150px;
        width: 400px;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #box1 {
        background-color: red;
        flex-grow: 1;
        /* position: fixed; */
        /* bottom: 20px;
        right: 20px; */
      }
      #box2 {
        flex-grow: 2;
        background-color: violet;
      }
      #box3 {
        /* align-self: self-start; */
        background-color: blue;
        /* position: relative;
        top: 50px;
        left: 50px; */
      }
      #box4 {
        background-color: brown;
        /* position: absolute; */
        top: 20px;
        right: 30px;
      }
      nav {
        background-color: gold;
        height: 100px;
        position: sticky;
        top: 20px;
      }
    </style>
