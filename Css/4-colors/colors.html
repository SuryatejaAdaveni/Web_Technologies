<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    h1:nth-child(1) {
      background-color: blanchedalmond;
    }
    h1:nth-child(2) {
      background-color: rgb(130, 145, 150);
    }
    h1:nth-child(3) {
      background-color: rgba(100, 255, 219, 0.2);
    }
    h1:nth-child(4) {
      background-color: hsl(356, 85%, 46%);
    }
    h1:nth-child(5) {
      background-color: hsla(240, 75%, 67%, 0.5);
    }
    h1:nth-child(6) {
      background-color: #fff000;
    }
  </style>
  <body>
    <h1>color</h1>
    <h1>rgb</h1>
    <h1>rgba</h1>
    <h1>hsl</h1>
    <h1>hsla</h1>
    <h1>HexaDecimal</h1>
  </body>
</html>
