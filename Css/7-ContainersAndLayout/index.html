<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #parent {
        height: 700px;
        display: flex;
        background: fixed
          url("https://www.prokabaddi.com/static-assets/waf-images/2b/62/71/16-9/JwJ9sHJFlQ.jpg")
          no-repeat;
        background-size: cover;
        justify-content: space-evenly;
        align-items: center;
      }
      #child1,
      #child2,
      #child3 {
        height: 400px;
        width: 400px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        border-radius: 25px;
      }
      img {
        height: 250px;
        width: 250px;
        border-radius: 25px;
        box-shadow: 23px 13px 54px;
      }
      img:hover {
        height: 400px;
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="parent">
      <div id="child1">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSI_NEvtZZfXWjg0tYAORz0yFu-cvcbhk-lkdXItABPNQ&s=10"
          alt=""
        />
      </div>
      <div id="child2">
        <img
          src="https://static.vecteezy.com/system/resources/previews/004/297/763/non_2x/versus-vs-logo-battle-headline-template-sparkling-lightning-design-isolated-illustration-on-black-background-vector.jpg"
          alt=""
        />
      </div>
      <div id="child3">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSI6PDD8iL49c2cSbUJnHnjZjpBhyH2lbZDjESEIgud3WM_vbJX9cRMDEix&s=10"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
