<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
      }
      body {
        height: 100vh;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: url(./mainbg.jpg) no-repeat;
        background-size: cover;
      }
      .maincontainer {
        width: 450px;
        min-height: 480px;
        padding: 35px 40px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        animation: openBox 3s ease-out 0s 1 normal;
      }
      .heading {
        text-align: center;
        margin-bottom: 30px;
      }
      .heading h2 {
        animation: comeFromBottom 0.8s ease-out 1.5s both;
        font-size: 30px;
        color: white;
        margin-bottom: 8px;
      }
      .heading p {
        font-size: 15px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        animation: comeFromBottom 0.8s ease-out 2s both;
      }
      .fields {
        margin-top: 30px;
        width: 90%;
        display: flex;
        flex-direction: column;
      }
      .fields input:first-child {
        animation: comeFromBottom 0.8s ease-out 2.5s both;
      }

      .fields input:last-child {
        animation: comeFromBottom 0.8s ease-out 3s both;
      }
      input {
        width: 100%;
        height: 45px;
        padding: 0 30px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        outline: none;
        background: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        font-weight: 500;
        transition: 0.3s;
      }
      input::placeholder {
        color: #777;
      }
      input:focus {
        border: 2px solid black;
      }
      .signupbtn {
        width: 90%;
        margin-top: 40px;
      }
      .signupbtn button {
        width: 100%;
        height: 45px;
        border: none;
        border-radius: 10px;
        background: #0757e8;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        animation: openBox 1s linear 3.5s 1 normal both;
      }
      button:hover {
        background: #0646b9;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
      }
      button:active {
        transform: translateY(0);
      }
      @keyframes openBox {
        0% {
          transform: translateY(700px) rotateY(90deg);
          opacity: 0;
        }

        100% {
          transform: translateY(0) rotateY(0deg);
          opacity: 1;
        }
      }
      @keyframes comeFromBottom {
        0% {
          opacity: 0;
          transform: translateY(1000px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="maincontainer">
      <div class="heading">
        <h2>Login In</h2>
        <p>Enter Your Details</p>
      </div>
      <div class="fields">
        <input
          type="text"
          placeholder="Enter Your Name"
          id="username"
          name="username"
          required
        />
        <br />
        <input
          type="password"
          placeholder="Enter Password"
          id="password"
          name="password"
          required
        />
      </div>
      <div class="signupbtn">
        <button onclick="login()">Log In</button>
      </div>
    </div>
    <script>
      function login() {
        let username = document.querySelector("#username").value;
        let password = document.querySelector("#password").value;
        let userfromstorage = localStorage.getItem("username");
        let passfromstorage = localStorage.getItem("password");
        if (username == userfromstorage && password == passfromstorage) {
          alert("Logged IN successfully");
          window.location.assign("home.html");
        } else {
          window.location.assign("login.html");
        }
      }
    </script>
  </body>
</html>
