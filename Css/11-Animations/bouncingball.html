<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Game Balls</title>
    <style>
      body {
        height: 90vh;
        width: 90vw;
        display: flex;
        align-items: flex-start;
        overflow: hidden;
        background-color: #f0f0f0;
      }
      img {
        margin: 0px 4px;
        height: 100px;
        width: auto;
        position: relative;
      }
      /* Updated IDs to use letters */
      #ball1 {
        animation: bounce 2s ease-in 0s infinite alternate;
      }
      #ball2 {
        animation: bounce 2s ease-in 0.1s infinite alternate;
      }
      #ball3 {
        animation: bounce 2s ease-in 0.2s infinite alternate;
      }
      #ball4 {
        animation: bounce 2s ease-in 0.3s infinite alternate;
      }
      #ball5 {
        animation: bounce 2s ease-in 0.4s infinite alternate;
      }
      #ball6 {
        animation: bounce 2s ease-in 0.5s infinite alternate;
      }
      #ball7 {
        animation: bounce 2s ease-in 0.6s infinite alternate;
      }
      #ball8 {
        animation: bounce 2s ease-in 0.7s infinite alternate;
      }
      #ball9 {
        animation: bounce 2s ease-in 0.8s infinite alternate;
      }
      #ball10 {
        animation: bounce 2s ease-in 0.9s infinite alternate;
      }
      #ball11 {
        animation: bounce 2s ease-in 1s infinite alternate;
      }
      #ball12 {
        animation: bounce 2s ease-in 1.1s infinite alternate;
      }
      #ball13 {
        animation: bounce 2s ease-in 1.2s infinite alternate;
      }

      @keyframes bounce {
        0% {
          left: 0px;
          top: 10px;
        }
        100% {
          right: 0px;
          top: 625px;
        }
      }
    </style>
  </head>
  <body>
    <img
      id="ball1"
      src="https://gallery.yopriceville.com/downloadfullsize/send/25002"
      alt="Basketball"
    />
    <img
      id="ball2"
      src="https://static.vecteezy.com/system/resources/thumbnails/068/010/955/small/classic-black-and-white-soccer-ball-png.png"
      alt="Soccer Ball"
    />
    <img
      id="ball3"
      src="https://www.freeiconspng.com/thumbs/tennis-ball-png/tennis-ball-png-picture-1.png"
      alt="Tennis Ball"
    />
    <img
      id="ball4"
      src="https://png.pngtree.com/png-vector/20250731/ourmid/pngtree-blue-yellow-and-white-volleyball-ball-png-image_16798436.webp"
      alt="Volleyball"
    />
    <img
      id="ball5"
      src="https://png.pngtree.com/png-clipart/20241230/original/pngtree-a-beautiful-white-cricket-ball-vector-art-illustration-png-image_18354962.png"
      alt="Cricket Ball"
    />
    <img
      id="ball6"
      src="https://png.pngtree.com/png-clipart/20240326/original/pngtree-billiard-eight-ball-flame-badge-png-image_14685964.png"
      alt="8 Ball"
    />
    <img
      id="ball7"
      src="https://png.pngtree.com/png-clipart/20250417/original/pngtree-rugby-ball-3d-png-image_20706699.png"
      alt="Rugby Ball"
    />
    <img
      id="ball8"
      src="https://png.pngtree.com/png-clipart/20250806/original/pngtree-bowling-ball-on-transparent-background-png-image_21542075.png"
      alt="Bowling Ball"
    />
    <img
      id="ball9"
      src="https://www.freeiconspng.com/uploads/disco-ball-png-26.gif"
      alt="Disco Ball"
    />
    <img
      id="ball10"
      src="https://png.pngtree.com/png-vector/20230903/ourmid/pngtree-sport-ball-golf-ball-png-png-image_9962815.png"
      alt="Golf Ball"
    />
    <img
      id="ball11"
      src="https://static.vecteezy.com/system/resources/previews/076/874/146/non_2x/yellow-sphere-ball-with-happy-smiling-face-emoji-expression-free-png.png"
      alt="Emoji Ball"
    />
    <img
      id="ball12"
      src="https://www.nicepng.com/png/full/23-230035_beach-ball-png.png"
      alt="Beach Ball"
    />
    <img
      id="ball13"
      src="https://png.pngtree.com/png-clipart/20250627/original/pngtree-colorful-soccer-ball-design-featuring-flags-of-various-nations-representing-international-png-image_21219581.png"
      alt="Flag Ball"
    />
  </body>
</html>
