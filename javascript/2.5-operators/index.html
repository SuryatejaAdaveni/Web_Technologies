<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Arithematic Operators
      let a = "10";
      let b = "20";
      console.log(a + b);
      console.log(a - b);
      console.log(a * b);
      console.log(a / b);
      console.log(a % b);

      // Assignment Operators
      let c = 40;
      c += 10;
      console.log(c);
      c -= 10;
      console.log(c);
      c *= 10;
      console.log(c);
      c /= 10;
      console.log(c);
      c %= 10;
      console.log(c);

      // Relational Operators
      if (a > b) console.log("A is Greater");
      else console.log("Nothing");

      // logical Operators
      let d = 25;
      let e = 30;
      console.log(d && e);
      console.log(d || e);
      // console.log(d ! e);
    </script>
  </body>
</html>
