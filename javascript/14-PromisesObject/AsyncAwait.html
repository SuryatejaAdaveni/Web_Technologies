<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div></div>
    <script>
      let div = document.querySelector("div");

      let fetchData = async () => {
        let data = await fetch("https://api.github.com/users");
        let dataobj = await data.json();
        console.log(dataobj);

        dataobj.forEach((user) => {
          div.innerHTML += `
            <h1>${user.login}</h1>
            <img src="${user.avatar_url}" alt="${element.login}" />
          `;
        });
      };

      fetchData();
    </script>
  </body>
</html>
